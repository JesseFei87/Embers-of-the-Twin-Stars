<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>月影峡道 · 分件重建</title><style>*{box-sizing:border-box}body{margin:0;background:#080f1c;color:#e0d2b4;font:14px Georgia,'Songti SC',serif;overflow:hidden}canvas{display:block}header{position:absolute;top:28px;left:32px;pointer-events:none}h1{margin:0 0 8px;font-size:27px;font-weight:400;letter-spacing:5px}small{color:#91a2b9;letter-spacing:2px}nav{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);display:flex;gap:8px;white-space:nowrap}button{background:#0c182be8;border:1px solid #67624f;color:#e7d6b4;padding:11px 18px;cursor:pointer;font:inherit}button:hover,button.active{background:#24364b;border-color:#e4c689}aside{position:absolute;right:26px;top:30px;color:#93a3b7;text-align:right;line-height:1.8}#part{position:absolute;left:32px;bottom:30px;font-size:12px;color:#c3d5eb}body.review header,body.review nav,body.review aside,body.review #part{display:none}</style></head><body><header><small>PROCEDURAL RECONSTRUCTION</small><h1>月影峡道</h1><small id="status">祭坛 · 结构检查</small></header><aside>拖动旋转 · 滚轮缩放<br>点击查看部件</aside><nav><button data-view="0">正面</button><button data-view="90">右侧</button><button data-view="180">背面</button><button data-view="270">左侧</button><button id="explode">拆分部件</button><button id="reset">复位</button></nav><div id="part"></div><script type="module" src="/src/moonlit-reconstruction/viewer.ts"></script></body></html>
